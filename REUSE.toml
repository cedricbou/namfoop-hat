#
# Licence de chaque dossier, pour les fichiers qui ne peuvent pas porter d'en-tête
# (KiCad, Gerber, BOM, images). Un en-tête SPDX dans le fichier l'emporte.
# Vérification : `reuse lint` (https://reuse.software), lancé par la CI.

version = 1

[[annotations]]
path = "hardware/**"
precedence = "closest"
SPDX-FileCopyrightText = "© 2026 les auteurs de namfoop-hat (AUTHORS.md)"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = ["firmware/**", "scripts/**"]
precedence = "closest"
SPDX-FileCopyrightText = "© 2026 les auteurs de namfoop-hat (AUTHORS.md)"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "docs/**"
precedence = "closest"
SPDX-FileCopyrightText = "© 2026 les auteurs de namfoop-hat (AUTHORS.md)"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Identité visuelle et logo de sérigraphie : tous droits réservés, quelle que soit
# la licence du dossier qui les contient (TRADEMARKS.md).
[[annotations]]
path = ["docs/identite/*.svg", "docs/identite/*.png", "hardware/bibliotheque/namfoop-hat.pretty/Logo_namfoop_*.kicad_mod"]
precedence = "override"
SPDX-FileCopyrightText = "© 2026 Cédric Boufflers, auteur de namfoop"
SPDX-License-Identifier = "LicenseRef-TousDroitsReserves"
